name: Shot submission
description: Share a before and after you made with the skill. Failed shots welcome
title: "[Shot] "
labels: ["showcase"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing. Successful, partial and failed shots all help: the failed ones show what to fix next.
        You keep full ownership of your footage and your work. Permission you give here is non-exclusive and you can withdraw it any time by commenting on this issue.
  - type: input
    id: links
    attributes:
      label: Before and after
      description: Links to the raw plate and the final shot (YouTube, Vimeo, Drive), or drag files into the next box
    validations:
      required: true
  - type: textarea
    id: ask
    attributes:
      label: What you asked the agent for
      placeholder: Put a glowing portal on the wall behind me
    validations:
      required: true
  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Successful
        - Partly successful
        - Failed
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Skill version
      description: From CHANGELOG.md or .claude-plugin/plugin.json
      placeholder: "1.5.0"
    validations:
      required: true
  - type: dropdown
    id: agent
    attributes:
      label: AI agent
      options:
        - Claude Code
        - Claude app or desktop
        - Codex
        - Cursor
        - Gemini CLI
        - Other (say which below)
    validations:
      required: true
  - type: input
    id: setup
    attributes:
      label: Camera, lens, computer and Blender version
      placeholder: Phone 26mm, M2 MacBook Air 16GB, Blender 5.3
  - type: input
    id: time
    attributes:
      label: Render time and total time spent
      placeholder: 25 s a frame, about 3 hours total
  - type: textarea
    id: manual
    attributes:
      label: What you fixed by hand, and what went wrong
  - type: input
    id: credit
    attributes:
      label: How to credit you
      placeholder: Name and a handle or link
  - type: checkboxes
    id: scope
    attributes:
      label: Where we may feature it (tick all you agree to)
      options:
        - label: The GitHub showcase (SHOWCASE.md)
        - label: Social media posts
        - label: Promotional or demo videos
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: I shot this footage myself or have the right to share it
          required: true
        - label: Everyone who appears in it agreed to it being shared
          required: true
        - label: I have the rights to any music, stock footage or other third-party material in it, or there is none
          required: true
