name: tests
on:
  push:
  pull_request:

jobs:
  engine:
    name: engine (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.13"]
        exclude:
          - {os: ubuntu-latest, python: "3.9"}  # no longer offered on GitHub's Ubuntu image
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install numpy opencv-python-headless pytest
      - run: python -m pytest tests -q

  blender:
    name: Blender ${{ matrix.bpy }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, bpy: "4.2.0", python: "3.11", numpy: "numpy<2"}
          - {os: ubuntu-latest, bpy: "5.3.0", python: "3.13", numpy: "numpy"}
          - {os: macos-latest, bpy: "5.3.0", python: "3.13", numpy: "numpy"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "bpy==${{ matrix.bpy }}" "${{ matrix.numpy }}" opencv-python-headless pytest
      - run: python -m pytest tests -q

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python skills/blender-vfx/scripts/vfx.py package dist/blender-vfx-skill.zip
      - uses: actions/upload-artifact@v4
        with:
          name: blender-vfx-skill
          path: dist/blender-vfx-skill.zip
